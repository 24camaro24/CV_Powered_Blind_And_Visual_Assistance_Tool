<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviGuide - Voice Navigation</title>
    <style>
        :root {
            --bg: #eef2f5;
            --panel: #ffffff;
            --panel-soft: #f8fafb;
            --text: #17202a;
            --muted: #5c6b76;
            --line: #d7e0e7;
            --primary: #14596b;
            --primary-dark: #0f4350;
            --accent: #d97706;
            --success: #18794e;
            --danger: #b42318;
            --shadow: 0 18px 48px rgba(19, 40, 56, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.5;
        }

        #root {
            max-width: 1120px;
            margin: 0 auto;
        }

        .container {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .app-header {
            margin-bottom: 24px;
        }

        h1 {
            color: var(--text);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        h2 {
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        h3 {
            font-size: 1rem;
            letter-spacing: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
        }

        .section {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .field-label {
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 600;
        }

        .source-actions {
            display: flex;
            gap: 12px;
        }

        .actions {
            display: flex;
            justify-content: center;
            margin: 24px 0 0;
        }

        .example-section {
            margin-top: 24px;
        }

        button {
            min-height: 44px;
            padding: 12px 18px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary.is-active {
            background: var(--success);
        }

        .btn-primary.recording {
            background: var(--danger);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--text);
            border-color: var(--line);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        .primary-action {
            min-width: 240px;
        }

        .target-input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #ffffff;
            color: var(--text);
            font-size: 1rem;
        }

        .target-input:focus,
        .upload-box:focus {
            outline: 3px solid rgba(20, 89, 107, 0.18);
            border-color: var(--primary);
        }

        .upload-box {
            min-height: 154px;
            padding: 22px;
            text-align: center;
            cursor: pointer;
            background: #ffffff;
            border: 2px dashed #8fb3bf;
            border-radius: 8px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .upload-box:hover,
        .upload-box.active {
            background: #f0f8fa;
            border-color: var(--primary);
        }

        input[type="file"] {
            display: none;
        }

        .upload-text {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .upload-hint,
        .status-line {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .preview-image {
            display: block;
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            margin-top: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #ffffff;
        }

        .support-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .support-preview-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .support-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .support-preview-item span {
            position: absolute;
            right: 6px;
            bottom: 6px;
            min-width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background: rgba(15, 67, 80, 0.9);
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .camera-preview {
            display: none;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #000000;
            border-radius: 8px;
        }

        .camera-preview.active {
            display: block;
        }

        .transcript-box {
            padding: 14px;
            background: #eef8f2;
            border: 1px solid #bfdecf;
            border-radius: 8px;
            color: #163b2a;
        }

        .transcript-box p + p {
            margin-top: 6px;
        }

        .hidden {
            display: none !important;
        }

        .results {
            margin-top: 26px;
            padding: 22px;
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .results h2 {
            margin-bottom: 16px;
        }

        .guidance-summary {
            padding: 20px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .summary-target {
            font-size: 0.95rem;
            opacity: 0.9;
            text-transform: uppercase;
            font-weight: 700;
        }

        .summary-action {
            margin-top: 8px;
            font-size: 1.45rem;
            font-weight: 800;
        }

        .summary-detail {
            margin-top: 4px;
            opacity: 0.92;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric-card {
            padding: 14px;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .metric-label {
            display: block;
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 700;
        }

        .metric-value {
            display: block;
            margin-top: 4px;
            color: var(--text);
            font-size: 1.18rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 13px 0;
            border-top: 1px solid var(--line);
        }

        .result-label {
            color: var(--muted);
            font-weight: 700;
        }

        .result-value {
            text-align: right;
            font-weight: 700;
        }

        .visualization {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .visualization h3 {
            margin-bottom: 12px;
            color: var(--text);
        }

        .visualization img {
            display: block;
            width: 100%;
            max-height: 680px;
            object-fit: contain;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .instruction-box {
            margin-top: 18px;
            padding: 18px;
            background: #fff8ed;
            border: 1px solid #f2d2a6;
            border-left: 5px solid var(--accent);
            border-radius: 8px;
        }

        .instruction-box h3 {
            margin-bottom: 8px;
            color: #8a4b00;
        }

        .audio-player {
            display: block;
            width: 100%;
            margin-top: 12px;
        }

        .error-box {
            margin-top: 22px;
            padding: 16px;
            background: #fff1f0;
            border: 1px solid #f6b7b1;
            border-left: 5px solid var(--danger);
            border-radius: 8px;
            color: #7a271a;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 100px;
            margin-top: 22px;
            color: var(--primary);
            font-weight: 700;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 4px solid #cddde3;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 900px) {
            .metrics-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 18px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .source-actions {
                flex-direction: column;
            }

            .primary-action,
            button {
                width: 100%;
            }
        }

        @media (max-width: 520px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .result-item {
                flex-direction: column;
                gap: 4px;
            }

            .result-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="app.js?v=example-flow"></script>
</body>
</html>
